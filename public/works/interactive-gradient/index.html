<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Gradient</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  overflow: hidden;
  font-family: 'Syne', sans-serif;
  background: #0a0e27;
}

/* cursor: none only on real pointer devices */
@media (hover: hover) and (pointer: fine) {
  body { cursor: none; }
}

#webGLApp {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
}

/* ── HEADING ── */
.heading {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  color: white;
  text-align: center;
  pointer-events: none;
  font-family: "Syne", sans-serif;
  font-size: clamp(3rem, 9vw, 9rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
  width: 90vw;
}

/* ── TOP CONTROLS ── */
/* wrapper holds both left (adjust) and right (schemes) */
.top-controls {
  position: fixed;
  top: 1.25rem;
  left: 0;
  right: 0;
  z-index: 100;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 0 1.25rem;
  gap: 0.75rem;
  pointer-events: none;
}

/* ── ADJUST COLORS BUTTON ── */
.toggle-adjuster-btn {
  pointer-events: auto;
  padding: 0.65rem 1.1rem;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  font-family: 'Syne', sans-serif;
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  backdrop-filter: blur(10px);
  border-radius: 8px;
  transition: all 0.3s;
  white-space: nowrap;
  flex-shrink: 0;
}
.toggle-adjuster-btn:hover {
  background: rgba(255,255,255,0.2);
  border-color: rgba(255,255,255,0.5);
}

/* ── SCHEME BUTTONS ── */
.color-controls {
  pointer-events: auto;
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  justify-content: flex-end;
  flex-shrink: 1;
}
.color-btn {
  height: 38px;
  padding: 0 0.9rem;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 20px;
  color: white;
  font-family: 'Syne', sans-serif;
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
  white-space: nowrap;
}
.color-btn:hover {
  background: rgba(255,255,255,0.2);
  border-color: rgba(255,255,255,0.5);
}
.color-btn.active {
  background: rgba(255,255,255,0.25);
  border-color: rgba(255,255,255,0.6);
}

/* ── COLOR ADJUSTER PANEL ── */
.color-adjuster-panel {
  position: fixed;
  top: 5rem;
  left: 1.25rem;
  z-index: 100;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 16px;
  padding: 1.5rem;
  width: calc(100vw - 2.5rem);
  max-width: 360px;
  pointer-events: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  display: none;
  max-height: calc(100vh - 7rem);
  overflow-y: auto;
}
.color-adjuster-panel.open { display: block; }

.color-adjuster-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.25rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.color-adjuster-title {
  color: white;
  font-family: 'Syne', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.color-adjuster-close {
  background: none;
  border: none;
  color: white;
  font-size: 1.4rem;
  cursor: pointer;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.7;
  transition: opacity 0.2s;
}
.color-adjuster-close:hover { opacity: 1; }

.color-picker-group { margin-bottom: 1rem; }
.color-picker-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.4rem;
  color: white;
  font-family: 'Inter', sans-serif;
  font-size: 0.8rem;
  font-weight: 500;
}
.color-picker-wrapper {
  display: flex;
  gap: 0.6rem;
  align-items: center;
}
.color-picker-input {
  width: 50px; height: 36px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 8px;
  cursor: pointer;
  background: none;
  padding: 0;
  -webkit-appearance: none;
  appearance: none;
  flex-shrink: 0;
}
.color-picker-input::-webkit-color-swatch-wrapper { padding: 0; }
.color-picker-input::-webkit-color-swatch { border: none; border-radius: 6px; }

.color-value-display {
  flex: 1;
  background: rgba(0,0,0,0.2);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 6px;
  padding: 0.4rem 0.6rem;
  color: white;
  font-family: 'Inter', monospace;
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  cursor: text;
  user-select: all;
  min-width: 0;
}
.copy-btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 6px;
  padding: 0.4rem 0.6rem;
  color: white;
  font-family: 'Inter', sans-serif;
  font-size: 0.7rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s;
  flex-shrink: 0;
}
.copy-btn:hover { background: rgba(255,255,255,0.2); }
.copy-btn.copied { background: rgba(76,175,80,0.3); border-color: rgba(76,175,80,0.5); }

.color-adjuster-actions {
  margin-top: 1.25rem;
  padding-top: 0.75rem;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.export-btn {
  width: 100%;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 8px;
  padding: 0.7rem;
  color: white;
  font-family: 'Syne', sans-serif;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s;
}
.export-btn:hover { background: rgba(255,255,255,0.25); }

/* ── FOOTER ── */
.footer {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  color: white;
  font-family: 'Syne', sans-serif;
  font-size: clamp(0.75rem, 1.5vw, 1rem);
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-align: center;
  pointer-events: auto;
  white-space: nowrap;
}
.footer a { color: white; text-decoration: none; transition: opacity 0.3s; }
.footer a:hover { opacity: 0.7; }

/* ── CUSTOM CURSOR (desktop only) ── */
.custom-cursor {
  position: fixed;
  width: 40px; height: 40px;
  border: 2px solid white;
  border-radius: 50%;
  pointer-events: none;
  z-index: 1000;
  transform: translate(-50%, -50%);
  transition: width 0.2s ease, height 0.2s ease, border-width 0.2s ease;
  background: transparent;
  will-change: transform;
  display: none; /* hidden until mouse detected */
}
.custom-cursor.visible { display: block; }
.custom-cursor::before {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 8px; height: 8px;
  background: white;
  border-radius: 50%;
}

/* ── MOBILE overrides ── */
@media (max-width: 600px) {
  .top-controls {
    top: 0.75rem;
    padding: 0 0.75rem;
    flex-direction: column;
    align-items: stretch;
    gap: 0.5rem;
  }

  .toggle-adjuster-btn {
    width: 100%;
    text-align: center;
    font-size: 0.7rem;
    padding: 0.55rem 0.75rem;
  }

  .color-controls {
    justify-content: flex-start;
    gap: 0.35rem;
  }

  .color-btn {
    height: 32px;
    padding: 0 0.65rem;
    font-size: 0.62rem;
    border-radius: 16px;
  }

  .color-adjuster-panel {
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    max-width: 100%;
    border-radius: 16px 16px 0 0;
    max-height: 70vh;
  }

  .heading {
    font-size: clamp(2.5rem, 13vw, 5rem);
    /* shift heading down a bit to clear the stacked controls */
    top: calc(50% + 2.5rem);
  }

  .footer { bottom: 1rem; font-size: 0.7rem; }
}
</style>
</head>
<body>

<h1 class="heading">Liquid Gradient</h1>

<div class="top-controls">
  <button class="toggle-adjuster-btn" id="toggleAdjusterBtn">Adjust Colors</button>
  <div class="color-controls">
    <button class="color-btn active" data-scheme="1">Scheme 1</button>
    <button class="color-btn" data-scheme="2">Scheme 2</button>
    <button class="color-btn" data-scheme="3">Scheme 3</button>
    <button class="color-btn" data-scheme="4">Scheme 4</button>
    <button class="color-btn" data-scheme="5">Scheme 5</button>
  </div>
</div>

<!-- Color Adjuster Panel -->
<div class="color-adjuster-panel" id="colorAdjusterPanel">
  <div class="color-adjuster-header">
    <h3 class="color-adjuster-title">Color Adjuster</h3>
    <button class="color-adjuster-close" id="closeAdjusterBtn">×</button>
  </div>
  <div class="color-picker-group">
    <div class="color-picker-label"><span>Color 1</span></div>
    <div class="color-picker-wrapper">
      <input type="color" class="color-picker-input" id="colorPicker1" data-color="1">
      <input type="text" class="color-value-display" id="colorValue1" readonly>
      <button class="copy-btn" data-copy="1">Copy</button>
    </div>
  </div>
  <div class="color-picker-group">
    <div class="color-picker-label"><span>Color 2</span></div>
    <div class="color-picker-wrapper">
      <input type="color" class="color-picker-input" id="colorPicker2" data-color="2">
      <input type="text" class="color-value-display" id="colorValue2" readonly>
      <button class="copy-btn" data-copy="2">Copy</button>
    </div>
  </div>
  <div class="color-picker-group">
    <div class="color-picker-label"><span>Color 3</span></div>
    <div class="color-picker-wrapper">
      <input type="color" class="color-picker-input" id="colorPicker3" data-color="3">
      <input type="text" class="color-value-display" id="colorValue3" readonly>
      <button class="copy-btn" data-copy="3">Copy</button>
    </div>
  </div>
  <div class="color-picker-group">
    <div class="color-picker-label"><span>Color 4</span></div>
    <div class="color-picker-wrapper">
      <input type="color" class="color-picker-input" id="colorPicker4" data-color="4">
      <input type="text" class="color-value-display" id="colorValue4" readonly>
      <button class="copy-btn" data-copy="4">Copy</button>
    </div>
  </div>
  <div class="color-picker-group">
    <div class="color-picker-label"><span>Color 5</span></div>
    <div class="color-picker-wrapper">
      <input type="color" class="color-picker-input" id="colorPicker5" data-color="5">
      <input type="text" class="color-value-display" id="colorValue5" readonly>
      <button class="copy-btn" data-copy="5">Copy</button>
    </div>
  </div>
  <div class="color-picker-group">
    <div class="color-picker-label"><span>Color 6</span></div>
    <div class="color-picker-wrapper">
      <input type="color" class="color-picker-input" id="colorPicker6" data-color="6">
      <input type="text" class="color-value-display" id="colorValue6" readonly>
      <button class="copy-btn" data-copy="6">Copy</button>
    </div>
  </div>
  <div class="color-adjuster-actions">
    <button class="export-btn" id="exportAllBtn">Export All Colors</button>
  </div>
</div>

<div class="custom-cursor" id="customCursor"></div>

<footer class="footer"><a href="#">LIQUID GRADIENT DEMO</a></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── TouchTexture ──
class TouchTexture {
  constructor() {
    this.size = 64;
    this.width = this.height = this.size;
    this.maxAge = 64;
    this.radius = 0.25 * this.size;
    this.speed = 1 / this.maxAge;
    this.trail = [];
    this.last = null;
    this.initTexture();
  }
  initTexture() {
    this.canvas = document.createElement("canvas");
    this.canvas.width = this.width;
    this.canvas.height = this.height;
    this.ctx = this.canvas.getContext("2d");
    this.ctx.fillStyle = "black";
    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    this.texture = new THREE.Texture(this.canvas);
  }
  update() {
    this.clear();
    for (let i = this.trail.length - 1; i >= 0; i--) {
      const point = this.trail[i];
      let f = point.force * this.speed * (1 - point.age / this.maxAge);
      point.x += point.vx * f;
      point.y += point.vy * f;
      point.age++;
      if (point.age > this.maxAge) this.trail.splice(i, 1);
      else this.drawPoint(point);
    }
    this.texture.needsUpdate = true;
  }
  clear() {
    this.ctx.fillStyle = "black";
    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
  }
  addTouch(point) {
    let force = 0, vx = 0, vy = 0;
    const last = this.last;
    if (last) {
      const dx = point.x - last.x;
      const dy = point.y - last.y;
      if (dx === 0 && dy === 0) return;
      const d = Math.sqrt(dx * dx + dy * dy);
      vx = dx / d; vy = dy / d;
      force = Math.min((dx*dx + dy*dy) * 20000, 2.0);
    }
    this.last = { x: point.x, y: point.y };
    this.trail.push({ x: point.x, y: point.y, age: 0, force, vx, vy });
  }
  drawPoint(point) {
    const pos = { x: point.x * this.width, y: (1 - point.y) * this.height };
    let intensity = 1;
    if (point.age < this.maxAge * 0.3) {
      intensity = Math.sin((point.age / (this.maxAge * 0.3)) * (Math.PI / 2));
    } else {
      const t = 1 - (point.age - this.maxAge * 0.3) / (this.maxAge * 0.7);
      intensity = -t * (t - 2);
    }
    intensity *= point.force;
    const radius = this.radius;
    let color = `${((point.vx+1)/2)*255}, ${((point.vy+1)/2)*255}, ${intensity*255}`;
    let offset = this.size * 5;
    this.ctx.shadowOffsetX = offset;
    this.ctx.shadowOffsetY = offset;
    this.ctx.shadowBlur = radius;
    this.ctx.shadowColor = `rgba(${color},${0.2*intensity})`;
    this.ctx.beginPath();
    this.ctx.fillStyle = "rgba(255,0,0,1)";
    this.ctx.arc(pos.x - offset, pos.y - offset, radius, 0, Math.PI * 2);
    this.ctx.fill();
  }
}

// ── GradientBackground ──
class GradientBackground {
  constructor(sceneManager) {
    this.sceneManager = sceneManager;
    this.mesh = null;
    this.uniforms = {
      uTime: { value: 0 },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uColor1: { value: new THREE.Vector3(0.945, 0.353, 0.133) },
      uColor2: { value: new THREE.Vector3(0.039, 0.055, 0.153) },
      uColor3: { value: new THREE.Vector3(0.945, 0.353, 0.133) },
      uColor4: { value: new THREE.Vector3(0.039, 0.055, 0.153) },
      uColor5: { value: new THREE.Vector3(0.945, 0.353, 0.133) },
      uColor6: { value: new THREE.Vector3(0.039, 0.055, 0.153) },
      uSpeed: { value: 1.2 },
      uIntensity: { value: 1.8 },
      uTouchTexture: { value: null },
      uGrainIntensity: { value: 0.08 },
      uZoom: { value: 1.0 },
      uDarkNavy: { value: new THREE.Vector3(0.039, 0.055, 0.153) },
      uGradientSize: { value: 1.0 },
      uGradientCount: { value: 6.0 },
      uColor1Weight: { value: 1.0 },
      uColor2Weight: { value: 1.0 }
    };
  }
  init() {
    const viewSize = this.sceneManager.getViewSize();
    const geometry = new THREE.PlaneGeometry(viewSize.width, viewSize.height, 1, 1);
    const material = new THREE.ShaderMaterial({
      uniforms: this.uniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.);
          vUv = uv;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec2 uResolution;
        uniform vec3 uColor1, uColor2, uColor3, uColor4, uColor5, uColor6;
        uniform float uSpeed, uIntensity;
        uniform sampler2D uTouchTexture;
        uniform float uGrainIntensity;
        uniform float uZoom;
        uniform vec3 uDarkNavy;
        uniform float uGradientSize, uGradientCount;
        uniform float uColor1Weight, uColor2Weight;
        varying vec2 vUv;
        #define PI 3.14159265359

        float grain(vec2 uv, float time) {
          vec2 g = uv * uResolution * 0.5;
          return fract(sin(dot(g + time, vec2(12.9898, 78.233))) * 43758.5453) * 2.0 - 1.0;
        }

        vec3 getGradientColor(vec2 uv, float time) {
          float gr = uGradientSize;
          vec2 c1  = vec2(0.5 + sin(time*uSpeed*0.4)*0.4,  0.5 + cos(time*uSpeed*0.5)*0.4);
          vec2 c2  = vec2(0.5 + cos(time*uSpeed*0.6)*0.5,  0.5 + sin(time*uSpeed*0.45)*0.5);
          vec2 c3  = vec2(0.5 + sin(time*uSpeed*0.35)*0.45, 0.5 + cos(time*uSpeed*0.55)*0.45);
          vec2 c4  = vec2(0.5 + cos(time*uSpeed*0.5)*0.4,  0.5 + sin(time*uSpeed*0.4)*0.4);
          vec2 c5  = vec2(0.5 + sin(time*uSpeed*0.7)*0.35, 0.5 + cos(time*uSpeed*0.6)*0.35);
          vec2 c6  = vec2(0.5 + cos(time*uSpeed*0.45)*0.5, 0.5 + sin(time*uSpeed*0.65)*0.5);
          vec2 c7  = vec2(0.5 + sin(time*uSpeed*0.55)*0.38, 0.5 + cos(time*uSpeed*0.48)*0.42);
          vec2 c8  = vec2(0.5 + cos(time*uSpeed*0.65)*0.36, 0.5 + sin(time*uSpeed*0.52)*0.44);
          vec2 c9  = vec2(0.5 + sin(time*uSpeed*0.42)*0.41, 0.5 + cos(time*uSpeed*0.58)*0.39);
          vec2 c10 = vec2(0.5 + cos(time*uSpeed*0.48)*0.37, 0.5 + sin(time*uSpeed*0.62)*0.43);
          vec2 c11 = vec2(0.5 + sin(time*uSpeed*0.68)*0.33, 0.5 + cos(time*uSpeed*0.44)*0.46);
          vec2 c12 = vec2(0.5 + cos(time*uSpeed*0.38)*0.39, 0.5 + sin(time*uSpeed*0.56)*0.41);

          float i1  = 1.0 - smoothstep(0.0, gr, length(uv-c1));
          float i2  = 1.0 - smoothstep(0.0, gr, length(uv-c2));
          float i3  = 1.0 - smoothstep(0.0, gr, length(uv-c3));
          float i4  = 1.0 - smoothstep(0.0, gr, length(uv-c4));
          float i5  = 1.0 - smoothstep(0.0, gr, length(uv-c5));
          float i6  = 1.0 - smoothstep(0.0, gr, length(uv-c6));
          float i7  = 1.0 - smoothstep(0.0, gr, length(uv-c7));
          float i8  = 1.0 - smoothstep(0.0, gr, length(uv-c8));
          float i9  = 1.0 - smoothstep(0.0, gr, length(uv-c9));
          float i10 = 1.0 - smoothstep(0.0, gr, length(uv-c10));
          float i11 = 1.0 - smoothstep(0.0, gr, length(uv-c11));
          float i12 = 1.0 - smoothstep(0.0, gr, length(uv-c12));

          vec2 r1 = uv - 0.5;
          float a1 = time*uSpeed*0.15;
          r1 = vec2(r1.x*cos(a1)-r1.y*sin(a1), r1.x*sin(a1)+r1.y*cos(a1)) + 0.5;
          vec2 r2 = uv - 0.5;
          float a2 = -time*uSpeed*0.12;
          r2 = vec2(r2.x*cos(a2)-r2.y*sin(a2), r2.x*sin(a2)+r2.y*cos(a2)) + 0.5;
          float ri1 = 1.0 - smoothstep(0.0, 0.8, length(r1-0.5));
          float ri2 = 1.0 - smoothstep(0.0, 0.8, length(r2-0.5));

          vec3 col = vec3(0.0);
          col += uColor1*i1*(0.55+0.45*sin(time*uSpeed))*uColor1Weight;
          col += uColor2*i2*(0.55+0.45*cos(time*uSpeed*1.2))*uColor2Weight;
          col += uColor3*i3*(0.55+0.45*sin(time*uSpeed*0.8))*uColor1Weight;
          col += uColor4*i4*(0.55+0.45*cos(time*uSpeed*1.3))*uColor2Weight;
          col += uColor5*i5*(0.55+0.45*sin(time*uSpeed*1.1))*uColor1Weight;
          col += uColor6*i6*(0.55+0.45*cos(time*uSpeed*0.9))*uColor2Weight;
          if (uGradientCount > 6.0) {
            col += uColor1*i7*(0.55+0.45*sin(time*uSpeed*1.4))*uColor1Weight;
            col += uColor2*i8*(0.55+0.45*cos(time*uSpeed*1.5))*uColor2Weight;
            col += uColor3*i9*(0.55+0.45*sin(time*uSpeed*1.6))*uColor1Weight;
            col += uColor4*i10*(0.55+0.45*cos(time*uSpeed*1.7))*uColor2Weight;
          }
          if (uGradientCount > 10.0) {
            col += uColor5*i11*(0.55+0.45*sin(time*uSpeed*1.8))*uColor1Weight;
            col += uColor6*i12*(0.55+0.45*cos(time*uSpeed*1.9))*uColor2Weight;
          }
          col += mix(uColor1,uColor3,ri1)*0.45*uColor1Weight;
          col += mix(uColor2,uColor4,ri2)*0.4*uColor2Weight;
          col = clamp(col,vec3(0.0),vec3(1.0))*uIntensity;
          float lum = dot(col,vec3(0.299,0.587,0.114));
          col = mix(vec3(lum),col,1.35);
          col = pow(col,vec3(0.92));
          float b1 = length(col);
          col = mix(uDarkNavy, col, max(b1*1.2, 0.15));
          float mb = length(col);
          if (mb > 1.0) col *= 1.0/mb;
          return col;
        }

        void main() {
          vec2 uv = vUv;
          vec4 t = texture2D(uTouchTexture, uv);
          float vx = -(t.r*2.0-1.0);
          float vy = -(t.g*2.0-1.0);
          float intensity = t.b;
          uv.x += vx*0.8*intensity;
          uv.y += vy*0.8*intensity;
          float dist = length(uv - 0.5);
          float ripple = sin(dist*20.0 - uTime*3.0)*0.04*intensity;
          float wave  = sin(dist*15.0 - uTime*2.0)*0.03*intensity;
          uv += vec2(ripple+wave);
          vec3 col = getGradientColor(uv, uTime);
          col += grain(uv, uTime)*uGrainIntensity;
          float ts = uTime*0.5;
          col.r += sin(ts)*0.02;
          col.g += cos(ts*1.4)*0.02;
          col.b += sin(ts*1.2)*0.02;
          float b2 = length(col);
          col = mix(uDarkNavy, col, max(b2*1.2, 0.15));
          col = clamp(col, vec3(0.0), vec3(1.0));
          float mb2 = length(col);
          if (mb2 > 1.0) col *= 1.0/mb2;
          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    this.mesh = new THREE.Mesh(geometry, material);
    this.sceneManager.scene.add(this.mesh);
  }
  update(delta) { if (this.uniforms.uTime) this.uniforms.uTime.value += delta; }
  onResize(w, h) {
    const v = this.sceneManager.getViewSize();
    if (this.mesh) { this.mesh.geometry.dispose(); this.mesh.geometry = new THREE.PlaneGeometry(v.width, v.height, 1, 1); }
    if (this.uniforms.uResolution) this.uniforms.uResolution.value.set(w, h);
  }
}

// ── App ──
class App {
  constructor() {
    this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", alpha: false, stencil: false, depth: false });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(this.renderer.domElement);
    this.renderer.domElement.id = "webGLApp";
    this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
    this.camera.position.z = 50;
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x0a0e27);
    this.clock = new THREE.Clock();
    this.touchTexture = new TouchTexture();
    this.gradientBackground = new GradientBackground(this);
    this.gradientBackground.uniforms.uTouchTexture.value = this.touchTexture.texture;
    this.colorSchemes = {
      1: { color1: new THREE.Vector3(0.945,0.353,0.133), color2: new THREE.Vector3(0.039,0.055,0.153) },
      2: { color1: new THREE.Vector3(1.0,0.424,0.314),   color2: new THREE.Vector3(0.251,0.878,0.816) },
      3: { color1: new THREE.Vector3(0.945,0.353,0.133), color2: new THREE.Vector3(0.039,0.055,0.153), color3: new THREE.Vector3(0.251,0.878,0.816) },
      4: { color1: new THREE.Vector3(0.949,0.4,0.2),     color2: new THREE.Vector3(0.176,0.42,0.427),  color3: new THREE.Vector3(0.82,0.686,0.612) },
      5: { color1: new THREE.Vector3(0.945,0.353,0.133), color2: new THREE.Vector3(0.0,0.259,0.22),    color3: new THREE.Vector3(0.945,0.353,0.133), color4: new THREE.Vector3(0,0,0), color5: new THREE.Vector3(0.945,0.353,0.133), color6: new THREE.Vector3(0,0,0) }
    };
    this.currentScheme = 1;
    this.init();
  }
  setColorScheme(scheme) {
    if (!this.colorSchemes[scheme]) return;
    this.currentScheme = scheme;
    const colors = this.colorSchemes[scheme];
    const u = this.gradientBackground.uniforms;
    if (scheme === 3) {
      u.uColor1.value.copy(colors.color1); u.uColor2.value.copy(colors.color2); u.uColor3.value.copy(colors.color3);
      u.uColor4.value.copy(colors.color1); u.uColor5.value.copy(colors.color2); u.uColor6.value.copy(colors.color3);
    } else if (scheme === 4) {
      u.uColor1.value.copy(colors.color1); u.uColor2.value.copy(colors.color2); u.uColor3.value.copy(colors.color3);
      u.uColor4.value.copy(colors.color1); u.uColor5.value.copy(colors.color2); u.uColor6.value.copy(colors.color3);
    } else if (scheme === 5) {
      u.uColor1.value.copy(colors.color1); u.uColor2.value.copy(colors.color2); u.uColor3.value.copy(colors.color3);
      u.uColor4.value.copy(colors.color4); u.uColor5.value.copy(colors.color5); u.uColor6.value.copy(colors.color6);
    } else {
      u.uColor1.value.copy(colors.color1); u.uColor2.value.copy(colors.color2);
      u.uColor3.value.copy(colors.color1); u.uColor4.value.copy(colors.color2);
      u.uColor5.value.copy(colors.color1); u.uColor6.value.copy(colors.color2);
    }
    // scheme-specific settings
    if (scheme === 1 || scheme === 5) {
      this.scene.background = new THREE.Color(0x0a0e27);
      u.uDarkNavy.value.set(0.039,0.055,0.153);
      u.uGradientSize.value = 0.45; u.uGradientCount.value = 12; u.uSpeed.value = 1.5;
      u.uColor1Weight.value = 0.5; u.uColor2Weight.value = 1.8;
    } else if (scheme === 4) {
      this.scene.background = new THREE.Color(0xffffff);
      u.uDarkNavy.value.set(0,0,0);
      u.uGradientSize.value = 1.0; u.uGradientCount.value = 6; u.uSpeed.value = 1.2;
      u.uColor1Weight.value = 1.0; u.uColor2Weight.value = 1.0;
    } else {
      this.scene.background = new THREE.Color(0x0a0e27);
      u.uDarkNavy.value.set(0.039,0.055,0.153);
      u.uGradientSize.value = 1.0; u.uGradientCount.value = 6; u.uSpeed.value = 1.2;
      u.uColor1Weight.value = 1.0; u.uColor2Weight.value = 1.0;
    }
  }
  init() {
    this.gradientBackground.init();
    this.setColorScheme(1);
    this.render();
    this.tick();
    window.addEventListener("resize", () => this.onResize());
    window.addEventListener("mousemove", e => this.onMouseMove(e));
    window.addEventListener("touchmove", e => this.onTouchMove(e), { passive: true });
  }
  onTouchMove(ev) {
    const t = ev.touches[0];
    this.onMouseMove({ clientX: t.clientX, clientY: t.clientY });
  }
  onMouseMove(ev) {
    this.touchTexture.addTouch({ x: ev.clientX / window.innerWidth, y: 1 - ev.clientY / window.innerHeight });
  }
  getViewSize() {
    const fov = (this.camera.fov * Math.PI) / 180;
    const h = Math.abs(this.camera.position.z * Math.tan(fov / 2) * 2);
    return { width: h * this.camera.aspect, height: h };
  }
  update(delta) { this.touchTexture.update(); this.gradientBackground.update(delta); }
  render() {
    const delta = Math.min(this.clock.getDelta(), 0.1);
    this.renderer.render(this.scene, this.camera);
    this.update(delta);
  }
  tick() { this.render(); requestAnimationFrame(() => this.tick()); }
  onResize() {
    this.camera.aspect = window.innerWidth / window.innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.gradientBackground.onResize(window.innerWidth, window.innerHeight);
  }
}

const app = new App();

// ── Scheme buttons ──
const colorButtons = document.querySelectorAll(".color-btn");
colorButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    app.setColorScheme(parseInt(btn.dataset.scheme));
    colorButtons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    updateColorPickersFromScheme();
  });
});

// ── Adjuster panel ──
const panel = document.getElementById("colorAdjusterPanel");
const toggleBtn = document.getElementById("toggleAdjusterBtn");
const closeBtn = document.getElementById("closeAdjusterBtn");

toggleBtn.addEventListener("click", () => {
  panel.classList.toggle("open");
  if (panel.classList.contains("open")) updateColorPickersFromScheme();
});
closeBtn.addEventListener("click", () => panel.classList.remove("open"));

function rgbToHex(r, g, b) {
  return "#" + [r,g,b].map(n => Math.round(n*255).toString(16).padStart(2,"0")).join("");
}
function hexToRgb(hex) {
  const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return r ? { r: parseInt(r[1],16)/255, g: parseInt(r[2],16)/255, b: parseInt(r[3],16)/255 } : null;
}

function updateColorPickersFromScheme() {
  const u = app.gradientBackground.uniforms;
  [u.uColor1,u.uColor2,u.uColor3,u.uColor4,u.uColor5,u.uColor6].forEach((c,i) => {
    const hex = rgbToHex(c.value.x, c.value.y, c.value.z);
    document.getElementById(`colorPicker${i+1}`).value = hex;
    document.getElementById(`colorValue${i+1}`).value = hex.toUpperCase();
  });
}

for (let i = 1; i <= 6; i++) {
  document.getElementById(`colorPicker${i}`).addEventListener("input", e => {
    const rgb = hexToRgb(e.target.value);
    if (rgb) {
      app.gradientBackground.uniforms[`uColor${i}`].value.set(rgb.r, rgb.g, rgb.b);
      document.getElementById(`colorValue${i}`).value = e.target.value.toUpperCase();
    }
  });
}

document.querySelectorAll(".copy-btn").forEach(btn => {
  btn.addEventListener("click", e => {
    const idx = e.target.dataset.copy;
    const text = document.getElementById(`colorValue${idx}`).value;
    navigator.clipboard.writeText(text).then(() => {
      e.target.textContent = "Copied!";
      e.target.classList.add("copied");
      setTimeout(() => { e.target.textContent = "Copy"; e.target.classList.remove("copied"); }, 2000);
    });
  });
});

document.getElementById("exportAllBtn").addEventListener("click", () => {
  const colors = Array.from({length:6}, (_,i) => document.getElementById(`colorValue${i+1}`).value);
  const text = `Color Scheme:\n${colors.map((c,i) => `Color ${i+1}: ${c}`).join("\n")}\n\nHex Array: [${colors.map(c=>`"${c}"`).join(", ")}]`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("exportAllBtn");
    btn.textContent = "Copied!";
    setTimeout(() => btn.textContent = "Export All Colors", 2000);
  });
});

// ── Custom cursor — desktop only ──
const isTouch = !window.matchMedia("(hover:hover) and (pointer:fine)").matches;
const cursor = document.getElementById("customCursor");

if (!isTouch) {
  let mx = 0, my = 0;
  document.addEventListener("mousemove", e => {
    mx = e.clientX; my = e.clientY;
    cursor.classList.add("visible");
    cursor.style.left = mx + "px";
    cursor.style.top  = my + "px";
  });

  const hoverBig = els => els.forEach(el => {
    el.addEventListener("mouseenter", () => { cursor.style.width = "54px"; cursor.style.height = "54px"; });
    el.addEventListener("mouseleave", () => { cursor.style.width = "40px"; cursor.style.height = "40px"; });
  });
  hoverBig(document.querySelectorAll(".color-btn, .toggle-adjuster-btn, .footer a, .copy-btn, .export-btn"));
}
</script>
