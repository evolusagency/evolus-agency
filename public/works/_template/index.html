<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo</title>
<style>
:root {
  --bg-color: #e0e5ec;
  --shadow-light: #ffffff;
  --shadow-dark: #a3b1c6;
  --text-dark: #2d3436;
  --text-muted: #636e72;
}

body,
html {
  margin: 0;
  padding: 0;
  background-color: var(--bg-color);
  font-family: "Segoe UI", Roboto, Helvetica, sans-serif;
  overflow-x: hidden;
  overscroll-behavior: none;
}

.scroll-wrapper {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  position: relative;
}

.scroll-instruction {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  font-weight: 700;
  color: var(--text-muted);
  z-index: 100;
  animation: bounce 2s infinite ease-in-out;
  pointer-events: none;
  background: var(--bg-color);
  padding: 10px 20px;
  border-radius: 20px;
  box-shadow: 4px 4px 10px var(--shadow-dark),
    -4px -4px 10px var(--shadow-light);
}

@keyframes bounce {
  0%,
  100% {
    transform: translate(-50%, 0);
  }
  50% {
    transform: translate(-50%, -15px);
  }
}

.canvas {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 2500px;
  height: 1000px;
}

.lines-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.line-path {
  stroke: var(--text-dark);
  stroke-width: 4;
  fill: none;
  stroke-linecap: round;
}

/* 3D Claymorphism Base */
.clay-element {
  position: absolute;
  transform: translate(-50%, -50%);
  background: var(--bg-color);
  box-shadow: 12px 12px 24px var(--shadow-dark),
    -12px -12px 24px var(--shadow-light);
  z-index: 2;
}

/* Connector Dots */
.connector-dot {
  width: 20px;
  height: 20px;
  background: var(--text-dark);
  border: 6px solid var(--bg-color);
  border-radius: 50%;
  box-shadow: 4px 4px 10px var(--shadow-dark),
    -4px -4px 10px var(--shadow-light);
  z-index: 3;
}

/* Plus Buttons */
.plus-btn {
  width: 44px;
  height: 44px;
  background: var(--text-dark);
  color: #fff;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
  font-weight: bold;
  box-shadow: 6px 6px 12px var(--shadow-dark),
    -6px -6px 12px var(--shadow-light),
    inset 2px 2px 4px rgba(255, 255, 255, 0.2),
    inset -2px -2px 4px rgba(0, 0, 0, 0.5);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  border: 2px solid var(--bg-color);
  z-index: 4;
}

.plus-btn:hover {
  background: #6f42c1;
  transform: translate(-50%, -50%) scale(1.15);
  box-shadow: 8px 8px 16px var(--shadow-dark),
    -8px -8px 16px var(--shadow-light),
    inset 2px 2px 6px rgba(255, 255, 255, 0.3),
    inset -2px -2px 6px rgba(0, 0, 0, 0.4);
}

/* Cards */
.card {
  width: 250px;
  height: 250px;
  border-radius: 32px;
  border: 3px solid rgba(255, 255, 255, 0.5);
  cursor: pointer;
  transition: transform 0.4s ease, box-shadow 0.4s ease;
}

.card:hover {
  transform: translate(-50%, -55%);
  box-shadow: 18px 18px 36px var(--shadow-dark),
    -18px -18px 36px var(--shadow-light);
  z-index: 10;
}

.card-video-wrap {
  position: relative;
  height: 190px;
  width: 100%;
  border-radius: 28px 28px 0 0;
  overflow: hidden;
  background: #000;
}

.thumbnail {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1;
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  opacity: 0.85;
  mix-blend-mode: hard-light;
}

/* Card Content Inner */
.header-badges {
  position: absolute;
  top: 16px;
  left: 16px;
  right: 16px;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.badge-group {
  display: flex;
  gap: 8px;
}

.badge {
  padding: 5px 12px;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 800;
  color: #fff;
  box-shadow: inset 2px 2px 4px rgba(255, 255, 255, 0.3),
    3px 3px 6px rgba(0, 0, 0, 0.3);
}

.badge.icon {
  padding: 6px 10px;
  font-size: 16px;
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 16px;
}

.title {
  position: absolute;
  bottom: 15px;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  font-weight: 800;
  font-size: 18px;
  z-index: 3;
  text-shadow: 0px 3px 6px rgba(0, 0, 0, 0.6);
  letter-spacing: 0.5px;
}

.card-stats {
  height: 60px;
  display: flex;
  justify-content: space-evenly;
  align-items: center;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-muted);
  background: var(--bg-color);
  border-radius: 0 0 28px 28px;
  box-shadow: inset 0px 4px 6px rgba(0, 0, 0, 0.03);
}

</style>
</head>

  <script>
// Register GSAP plugins
gsap.registerPlugin(ScrollTrigger);

// 1. Horizontal Scroll Timeline (Pins wrapper, scrubs canvas left)
const canvas = document.querySelector(".canvas");

// Calculate max scroll dynamically based on canvas and viewport width
let scrollMax = canvas.scrollWidth - window.innerWidth + 200;

const horizontalTween = gsap.to(canvas, {
  x: -scrollMax,
  ease: "none",
  scrollTrigger: {
    trigger: ".scroll-wrapper",
    pin: true,
    scrub: 1, // Smooth scrubbing
    end: () => "+=" + scrollMax // Maps 1px of horizontal movement to 1px of vertical scroll
  }
});

// 2. Hide scroll instruction when user begins scrolling
gsap.to(".scroll-instruction", {
  opacity: 0,
  y: 20,
  scrollTrigger: {
    trigger: "body",
    start: "top -50",
    end: "top -100",
    scrub: true
  }
});

// 3. Draw SVG Lines Interactively
const paths = document.querySelectorAll(".line-path");
paths.forEach((path) => {
  const length = path.getTotalLength();
  // Setup dash array to hide lines initially
  gsap.set(path, { strokeDasharray: length, strokeDashoffset: length });

  // Animate lines drawing in as they enter the screen horizontally
  gsap.to(path, {
    strokeDashoffset: 0,
    ease: "power2.inOut",
    scrollTrigger: {
      trigger: path,
      containerAnimation: horizontalTween,
      start: "left right-=200",
      end: "right center",
      scrub: true
    }
  });
});

// 4. Pop-in animations for Cards, Dots, and Buttons
const revealElements = document.querySelectorAll(".gs-reveal");
revealElements.forEach((el) => {
  gsap.from(el, {
    scale: 0,
    opacity: 0,
    rotation: el.classList.contains("plus-btn") ? -90 : 0,
    duration: 0.8,
    ease: "back.out(1.4)",
    scrollTrigger: {
      trigger: el,
      containerAnimation: horizontalTween,
      start: "left right-=150",
      toggleActions: "play none none reverse"
    }
  });
});
  </script>
