backend:
  name: github
  repo: evolusagency/evolus-agency
  branch: main
  base_url: https://decap-proxy.evolusagency.workers.dev
  auth_endpoint: /auth

media_folder: public/images
public_folder: /images

collections:
  - name: automation
    label: Automatisation
    folder: src/content/blog/automation
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields: &default_fields
      - { label: Titre, name: title, widget: string }
      - { label: Extrait, name: excerpt, widget: text }
      - { label: Date, name: date, widget: string }
      - { label: Tag, name: tag, widget: string }
      - { label: "Temps de lecture", name: read, widget: string }
      - { label: Langue, name: lang, widget: select, options: ["fr", "en"], default: "fr" }
      - { label: "Image de couverture", name: image, widget: image, required: false }
      - { label: Corps, name: body, widget: markdown }

  - name: seo
    label: SEO
    folder: src/content/blog/seo
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields: *default_fields

