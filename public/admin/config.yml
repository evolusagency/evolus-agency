backend:
  name: github
  repo: evolusagency/evolus-agency
  branch: main
  base_url: https://decap-proxy.evolusagency.workers.dev
  auth_endpoint: /auth

media_folder: public/images
public_folder: /images

# ─────────────────────────────────────────────────────────────────
# Champs partagés — réutilisés dans toutes les collections blog
# via l'alias YAML *blog_fields
# ─────────────────────────────────────────────────────────────────
_blog_fields: &blog_fields
  - { label: Titre,              name: title,   widget: string }
  - { label: Extrait,            name: excerpt,  widget: text }
  - { label: Date,               name: date,     widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
  - { label: Tag,                name: tag,      widget: string }
  - { label: "Temps de lecture", name: read,     widget: string }
  - label: Langue
    name: lang
    widget: select
    options: ["fr", "en"]
    default: "fr"
  - label: Cluster
    name: cluster
    widget: select
    options:
      - { label: "Automation",  value: "automation" }
      - { label: "Marketing",   value: "marketing" }
      - { label: "SEO",         value: "seo" }
      - { label: "Web Design",  value: "web-design" }
      - { label: "Branding",    value: "branding" }
      - { label: "IA",          value: "ia" }
      - { label: "Growth",      value: "growth" }
      - { label: "Sales",       value: "sales" }
      - { label: "Finance",     value: "finance" }
      - { label: "Leadership",  value: "leadership" }
      - { label: "Stratégie",   value: "strategy" }
  - { label: "Image de couverture", name: image, widget: image, required: false }
  - { label: Corps,              name: body,     widget: markdown }

# ─────────────────────────────────────────────────────────────────
# Collections — une par cluster
# ─────────────────────────────────────────────────────────────────
collections:

  - name: automation
    label: "⚙️  Automation"
    folder: src/content/blog/automation
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} — {{date}}"
    fields: *blog_fields

  - name: marketing
